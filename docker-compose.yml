version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: neuroflow-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Mongoose URI should be passed correctly from local host
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - neuroflow-net

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: neuroflow-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - neuroflow-net

networks:
  neuroflow-net:
    driver: bridge
